<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ScrapSetu – Choose Role</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background: linear-gradient(135deg, #f3faf6, #eef7f2);
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding-top: 40px;
        }
        .logo {
            width: 78px;
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            background: linear-gradient(135deg, #dff7e8, #edf9f1);
            font-size: 40px;
            box-shadow: 0 10px 25px rgba(25,135,84,0.10);
            margin-bottom: 20px;
        }
        .role-card {
            background: rgba(255,255,255,0.95);
            padding: 30px 25px;
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(25,135,84,0.15);
            border: 1px solid #e5f0e9;
            text-align: center;
            max-width: 380px;
        }
        .role-card h1 {
            color: #198754;
            margin: 0 0 8px;
        }
        .role-card p {
            margin: 0 0 20px;
            color: #7a8790;
        }
        .role-buttons a {
            display: inline-block;
            margin: 0.5rem 1rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #198754, #27a965);
            color: #fff;
            border-radius: 13px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(25,135,84,0.20);
        }
        .role-buttons a:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(25,135,84,0.25);
        }
    </style>
</head>
<body>
    <div class="logo">♻️</div>
    <div class="role-card">
        <h1>Welcome to ScrapSetu</h1>
        <p>Please select your portal</p>
        <div class="role-buttons">
            <a href="Collector/index.html">Collector</a>
            <a href="Recycler/index.html">Recycler</a>
        </div>
    </div>
</body>
</html>
