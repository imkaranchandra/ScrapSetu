<!DOCTYPE html>
<html>
<head>
    <title>ScrapSetu - Recycler Signup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="signup" class="login-page">
        <div class="login-card">
            <div class="logo">♻️</div>
            <h1>ScrapSetu</h1>
            <p class="portal">Recycler Portal</p>
            <h2>Create Recycler ID</h2>
            <input id="signupName" type="text" placeholder="👤 Business Name">
            <input id="signupMobile" type="text" placeholder="📱 Mobile Number">
            <input id="signupPass" type="password" placeholder="🔒 Choose Password">
            <input id="signupCity" type="text" placeholder="📍 City / Location">
            <button class="login-btn" onclick="register()">Create Recycler ID →</button>
            <div class="auth-toggle">
                Already have an ID? <a href="index.html">Login</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
